services:
  resources:
    build:
      context: .
      dockerfile: resources/Dockerfile
    environment:
      NEOS_RESOURCE_DIR: /data
      NEOS_RESOURCE_CONFIG_DIR: /config
      NEOS_RESOURCE_STORAGE_BASE: /data
      NEOS_RESOURCE_CONCURRENCY: ${NEOS_RESOURCE_CONCURRENCY:-6}
      NEOS_RESOURCE_AUTO_SYNC: ${NEOS_RESOURCE_AUTO_SYNC:-1}
      NEOS_RESOURCE_OFFLINE: ${NEOS_RESOURCE_OFFLINE:-0}
    volumes:
      - type: bind
        source: ${NEOS_RESOURCE_DATA_DIR:-../neos-data}
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: ${NEOS_RESOURCE_CONFIG_DIR:-../neos-config}
        target: /config
        bind:
          create_host_path: true
    networks:
      default:
        aliases:
          - neos-resources
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 3
    restart: unless-stopped
  neos:
    build: .
    environment:
      NEOS_RESOURCE_URL: ${NEOS_RESOURCE_URL:-http://resources:8788}
    depends_on:
      resources:
        condition: service_healthy
    ports:
      - "0.0.0.0:${NEOS_PORT:-18080}:80"
    restart: unless-stopped
