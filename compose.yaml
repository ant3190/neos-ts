services:
  resources:
    build:
      context: .
      dockerfile: resources/Dockerfile
    environment:
      NEOS_RESOURCE_DIR: /data
      NEOS_RESOURCE_CONCURRENCY: ${NEOS_RESOURCE_CONCURRENCY:-6}
    volumes:
      - resource-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 3
    restart: unless-stopped
  neos:
    build: .
    depends_on:
      resources:
        condition: service_healthy
    volumes:
      - resource-data:/srv/resources:ro
    ports:
      - "0.0.0.0:${NEOS_PORT:-18080}:80"
    restart: unless-stopped

volumes:
  resource-data:
