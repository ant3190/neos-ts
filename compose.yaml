services:
  neos:
    build: .
    environment:
      NEOS_RESOURCE_URL: ${NEOS_RESOURCE_URL:-http://neos-resources:8788}
    networks:
      - default
      - resources
    ports:
      - "0.0.0.0:${NEOS_PORT:-18080}:80"
    restart: unless-stopped

networks:
  resources:
    external: true
    name: ${NEOS_RESOURCE_NETWORK:-neos-resources}
